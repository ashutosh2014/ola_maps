name: ola_maps
description: Ola Maps Flutter plugin (Android and iOS SDK map views) plus Places / Geocoder helpers. Vendored from ola_maps_flutter 0.2.0.
version: 0.3.0
homepage: https://github.com/ashutosh2014/ola_maps
repository: https://github.com/ashutosh2014/ola_maps

environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=3.3.0"

dependencies:
  flutter:
    sdk: flutter
  plugin_platform_interface: ^2.0.2
  http: ^1.1.0
  animated_custom_dropdown: ^3.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  plugin:
    platforms:
      android:
        package: com.example.ola_maps_flutter
        pluginClass: OlaMapViewFlutterPlugin
      ios:
        pluginClass: OlaMapViewFlutterPlugin

topics:
  - maps
  - ola-maps
  - navigation
  - geolocation
  - markers

screenshots:
  - description: "Ola Maps with markers and overlays"
    path: screenshots/app_screenshot.png
