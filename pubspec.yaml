name: ola_maps
description: Ola Maps Flutter plugin (Android, iOS, and Web SDK map views) plus Places / Geocoder helpers. Vendored from ola_maps_flutter 0.2.0.
version: 0.3.1
homepage: https://github.com/ashutosh2014/ola_maps
repository: https://github.com/ashutosh2014/ola_maps

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  plugin_platform_interface: ^2.0.2
  http: ^1.1.0
  animated_custom_dropdown: ^3.1.1
  web: ^1.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  plugin:
    platforms:
      android:
        package: com.example.ola_maps_flutter
        pluginClass: OlaMapViewFlutterPlugin
      ios:
        pluginClass: OlaMapViewFlutterPlugin
      web:
        pluginClass: OlaMapViewFlutterWeb
        fileName: ola_map_view_flutter_web.dart

topics:
  - maps
  - ola-maps
  - navigation
  - geolocation
  - markers

screenshots:
  - description: "Directions polyline, markers, and location search in the example app"
    path: screenshots/demo_directions.jpg
  - description: "Location search pin with coverage circle in the example app"
    path: screenshots/demo_search.jpg
  - description: "Ola Maps with markers and overlays"
    path: screenshots/app_screenshot.png
